name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Each scripts/test_*.py is a standalone suite that exits non-zero on failure.
      # Run all of them and report every failing suite instead of stopping at the first.
      - name: Run test suites
        shell: bash
        run: |
          failed=()
          for f in scripts/test_*.py; do
            echo "::group::$f"
            if ! python "$f"; then failed+=("$f"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: web
        run: npx tsc --noEmit && npm run build
